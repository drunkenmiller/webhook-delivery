# Dependabot opens PRs when dependencies have new versions (and for security advisories).
# Grouped weekly so it doesn't flood the repo with one PR per package.
version: 2
updates:
  # npm workspaces: one entry at the root covers api/ and tools/receiver/ (single lockfile).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: ['/api', '/tools/receiver']
    schedule:
      interval: weekly
