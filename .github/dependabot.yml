# Dependabot opens PRs when dependencies have new versions (and for security advisories).
# Grouped weekly so it doesn't flood the repo with one PR per package.
version: 2
updates:
  # npm workspaces: one entry at the root covers api/ and tools/receiver/ (single lockfile).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ['*']
    ignore:
      # We stay on Node.js 24 (ADR 0004); @types/node must match the runtime major version.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: ['/api', '/tools/receiver']
    schedule:
      interval: weekly
    ignore:
      # Base image stays on node:24-alpine (ADR 0004); minor/patch image updates still come in.
      - dependency-name: node
        update-types: ['version-update:semver-major']
