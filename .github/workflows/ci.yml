# CI for the Node.js workspaces (api, tools/receiver, dashboard) and the Go worker. GitHub runs this on its own machines
# ("runners") on every pull request and on every push to main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # One install at the root installs every workspace from the single package-lock.json.
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # The dashboard is a static bundle: prove it still builds.
      - run: npm run build --workspace dashboard

  # Proves the production images still build (they are not published anywhere yet).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build --file api/Dockerfile --tag webhook-delivery-api:ci .
      - run: docker build --tag webhook-delivery-receiver:ci tools/receiver
      - run: docker build --tag webhook-delivery-worker:ci worker

  # Tests against a real PostgreSQL 18 started by Testcontainers (Docker is preinstalled on the
  # Ubuntu runners).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  # The Go worker: formatting, vet, and every test with the race detector. The store and worker
  # packages start PostgreSQL with Testcontainers, like the API's integration job.
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum
      # gofmt -l lists badly formatted files; any output fails the step.
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
