# CI for the test receiver (tools/receiver): same checks as the API.
name: receiver

on:
  pull_request:
    paths: ['tools/receiver/**', '.github/workflows/receiver.yml']
  push:
    branches: [main]
    paths: ['tools/receiver/**', '.github/workflows/receiver.yml']

concurrency:
  group: receiver-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/receiver
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/receiver/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
