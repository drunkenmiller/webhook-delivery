# Local development infrastructure.
#   docker compose up -d     start in the background
#   docker compose ps        status (wait for "healthy")
#   docker compose logs -f   follow logs
#   docker compose down      stop (data is kept in the volume)
#   docker compose down -v   stop AND delete the data volume

services:
  db:
    image: postgres:18-alpine          # official image, pinned to the major version
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webhooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webhooks}
      POSTGRES_DB: ${POSTGRES_DB:-webhooks}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"  # host:container — change the left side if 5432 is taken
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/…,
      # so the volume is mounted on the parent directory.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The services below belong to the "app" profile: plain `docker compose up` starts only the
  # database (so `npm run dev` can use port 3000); `docker compose --profile app up` adds them.
  api:
    profiles: [app]
    build:
      context: .                       # repository root (workspace lockfile lives there)
      dockerfile: api/Dockerfile
    environment:
      # Inside the Compose network the database host is the service name "db", not localhost.
      DATABASE_URL: postgres://${POSTGRES_USER:-webhooks}:${POSTGRES_PASSWORD:-webhooks}@db:5432/${POSTGRES_DB:-webhooks}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy    # wait for the db healthcheck, not just container start

  receiver:
    profiles: [app]
    build: ./tools/receiver
    environment:
      WEBHOOK_SECRET: ${RECEIVER_WEBHOOK_SECRET:-}   # empty = signatures not checked
    ports:
      - "${RECEIVER_PORT:-4000}:4000"

  # Added in a later milestone: worker.

volumes:
  pgdata:
